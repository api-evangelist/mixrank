generated: '2026-08-14'
method: searched
source: https://mixrank.com/api/documentation
api: openapi/mixrank-openapi.yml
authentication:
  style: api-key-in-path
  detail: API key supplied as a URL path segment; see authentication/mixrank-authentication.yml
  ref: authentication/mixrank-authentication.yml
media_type:
  request: application/json
  response: application/json
  notes: All responses are JSON. Dates use ISO 8601 (YYYY-MM-DD). Empty fields return null.
pagination:
  style: offset
  params:
    offset: Number of results to skip (default 0)
    page_size: Results per page (varies by endpoint, typically 1-100)
    sort_field: Field to sort by
    sort_order: Sort direction (asc/desc)
  notes: >-
    List endpoints use offset-based pagination with optional sort_field and
    sort_order. Large extraction jobs use the asynchronous segment-query and
    bulk-job pattern instead of paging (see async).
idempotency:
  supported: false
  notes: >-
    MixRank does not document an idempotency-key header. Most operations are
    read-only GETs; the write surface (bulk email-validation jobs, segment
    queries) is job-based rather than idempotent-by-key.
async:
  supported: true
  pattern: job
  detail: >-
    Bulk email validation and segment extraction are asynchronous. A job is
    created (POST /email/validate/bulk-job, GET/POST segment-query), then polled
    (GET /email/validate/bulk-job/{job_id}, GET /segment-result), and output can
    be deleted (DELETE /email/validate/bulk-job/{job_id}).
error_envelope:
  shape: object with an "errors" field
  detail: >-
    Errors are returned in an "errors" field with an appropriate HTTP status
    code. See errors/mixrank-problem-types.yml.
  ref: errors/mixrank-problem-types.yml
rate_limit_signaling:
  detail: >-
    Request limits depend on the API license tier; remaining quota is checked
    via the /usage endpoint. Exceeding limits may interrupt service.
  ref: rate-limits/mixrank-rate-limits.yml
versioning:
  scheme: uri-path
  current: v2
  detail: Version is embedded in the base path (/v2/json/).
  ref: lifecycle/mixrank-lifecycle.yml
webhooks:
  supported: true
  style: request-scoped callback
  standard: Standard Webhooks
  parameter: webhook
  operations: [prospectEmail, validateEmail]
  detail: >-
    The long-running email operations accept a `webhook` query parameter holding
    an https URL. Supplying one flips the call asynchronous: MixRank answers 202
    with {"id": ..., "status": "accepted"} and POSTs the result to that URL when
    ready. Deliveries follow Standard Webhooks — Webhook-Id, Webhook-Timestamp
    and Webhook-Signature (v1,<base64 hmac-sha256 of "<id>.<timestamp>.<body>">,
    keyed with your API key). Retried with backoff until the endpoint answers
    2xx, abandoned after 10 attempts.
  ref: asyncapi/mixrank-webhooks.yml
caching:
  supported: true
  detail: >-
    Email validation exposes an explicit freshness contract rather than HTTP
    cache headers. `strategy` selects cached (cache only), fetch (ignore cache),
    strict (cached if newer than `maxage` seconds, else fetch) or besteffort
    (default: cached if newer than maxage, else fetch, falling back to the cached
    result on failure). `maxage` is the acceptable age in seconds. Bulk jobs
    report the `strategy` and `maxage` they ran under.
  parameters: [strategy, maxage, timeout]
privacy_controls:
  parameter: private
  detail: >-
    Email validation and bulk jobs accept `private` — when true no log is kept of
    the address validated, and a private bulk job's output can be deleted with
    DELETE /email/validate/bulk-job/{job_id}.
case_sensitivity:
  detail: >-
    Optional parameter names are case-sensitive. `Page_Size` is silently ignored
    where `page_size` is honoured — a documented silent-failure trap worth
    encoding into any client.
