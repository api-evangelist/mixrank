aid: mixrank
name: MixRank
description: >-
  MixRank curates ultra-high-frequency technographic, firmographic, and people
  data for enterprise data teams, refreshed as often as hourly. Its datasets
  cover 45M+ company profiles, 800M+ employee/people profiles, 20M+ iOS and
  Android mobile apps with granular SDK-install intelligence, in-app purchases,
  app rankings and privacy labels, and web technographics across 80M+ websites.
  MixRank exposes these datasets through a JSON REST Data API (Enrich, Match,
  segment queries, email verification, mobile app & SDK intelligence, and web
  tags) as well as flat-file feeds and native cloud deliveries (PostgreSQL,
  Snowflake, Amazon Redshift, BigQuery). Customers use it for B2B data
  enrichment, investment intelligence, fraud prevention and identity resolution,
  mobile/SDK competitive intelligence, and candidate enrichment.
